name: Build

# Builds, tests and packages Game Companion on Arch Linux, as the person runs
# it (Qt 6 with KDE's layer-shell-qt). The package is kept as the run's
# artifact, and every push to main publishes it as a release with a
# manifest (latest.json) that the app's update check reads.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools and Qt
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust clang \
            qt6-base qt6-declarative qt6-svg qt6-wayland layer-shell-qt xdg-desktop-portal polkit curl mpv
      - uses: actions/checkout@v4
      - name: Tests
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Package
        env:
          GC_BUILD: ${{ github.run_number }}
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          su builder -c "GC_BUILD=$GC_BUILD makepkg --noconfirm --nocheck"
      - uses: actions/upload-artifact@v4
        with:
          name: game-companion-arch-package
          path: packaging/arch/*.pkg.tar.zst
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          pacman -S --noconfirm --needed github-cli jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          pkg=$(ls packaging/arch/game-companion-[0-9]*.pkg.tar.zst | head -n1)
          name=$(basename "$pkg")
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version-$BUILD"
          jq -nc --arg v "$version" --argjson b "$BUILD" \
            --arg u "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" \
            --arg s "$(sha256sum "$pkg" | cut -d' ' -f1)" \
            '{version:$v, build:$b, archUrl:$u, archSha256:$s}' > latest.json
          cat latest.json
          git log -1 --format='%s%n%n%b' > notes.txt
          gh release create "$tag" "$pkg" latest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Game Companion $version (build $BUILD)" --notes-file notes.txt --latest
