[package]
name = "game-companion"
version = "0.8.3"
edition = "2021"
license = "GPL-3.0-or-later"
description = "An overlay for every game on Linux (KDE Plasma, Wayland)"
repository = "https://github.com/Xzero3007/Game-Companion"
publish = false

[features]
# KDE's overlay layer (LayerShellQt): the overlay sits above a fullscreen game
# and places itself. Off only for builds where layer-shell-qt 6 is missing.
default = ["layer-shell"]
layer-shell = []

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
flate2 = "1"
libc = "0.2"
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
aion2 = { path = "crates/aion2", features = ["live"] }

[workspace]
members = [".", "crates/aion2"]

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
strip = true
